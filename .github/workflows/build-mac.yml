name: Build macOS plug-ins
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Package
        run: |
          mkdir out
          cp -R "build/RackStrip_artefacts/Release/VST3/Series 500 Modular Rack.vst3" out/
          cp -R "build/RackStrip_artefacts/Release/AU/Series 500 Modular Rack.component" out/
          cp -R "build/RackStrip_artefacts/Release/Standalone/Series 500 Modular Rack.app" out/
          codesign --force --deep -s - "out/Series 500 Modular Rack.vst3"
          codesign --force --deep -s - "out/Series 500 Modular Rack.component"
          codesign --force --deep -s - "out/Series 500 Modular Rack.app"
          ditto -c -k --keepParent out Series500ModularRack-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Series500ModularRack-macOS
          path: Series500ModularRack-macOS.zip
